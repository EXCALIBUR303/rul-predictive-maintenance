experiment:
  subset: FD002
  data_dir: data/raw/CMAPSSData
  output_dir: artifacts/portfolio
  seeds:
  - 42
data:
  rul_cap: 125
  window_length: 30
  validation_fraction: 0.2
  scaler: minmax
  low_variance_threshold: 1.0e-08
  low_unique_threshold: 2
  n_regimes: 6
training:
  batch_size: 256
  max_epochs: 3
  patience: 3
  learning_rate: 0.003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  loss: mse
  num_workers: 0
xgboost:
  n_estimators: 120
  max_depth: 4
  learning_rate: 0.08
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  reg_lambda: 1.0
  tree_method: hist
  objective: reg:squarederror
  early_stopping_rounds: 15
  n_jobs: 2
neural:
  hidden_size: 32
  num_layers: 1
  dropout: 0.1
  d_model: 32
  nhead: 4
  dim_feedforward: 64
