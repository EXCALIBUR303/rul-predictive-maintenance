[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rul-predictive-maintenance"
version = "0.1.0"
description = "Leakage-safe C-MAPSS remaining useful life experiments comparing XGBoost and sequence models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["httpx>=0.27", "pytest>=8.0"]
explain = ["captum>=0.7", "shap>=0.45"]
models = ["torch>=2.2", "xgboost>=2.0"]
all = [
  "captum>=0.7",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pytest>=8.0",
  "shap>=0.45",
  "torch>=2.2",
  "uvicorn>=0.27",
  "xgboost>=2.0",
]

[project.scripts]
rulpm = "rul_pm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
